services:
  db:
    image: docker.io/library/postgres@sha256:1938c16e9d2f10a6a3623b344b64ae8d45f407f2c5f34f0979468bb689b9227a
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_DB: ${NMT_PG_DATABASE:?}
      POSTGRES_USER: ${NMT_PG_USER:?}
      POSTGRES_PASSWORD: ${NMT_PG_PASSWORD:?}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 1s
      timeout: 3s
      retries: 60
